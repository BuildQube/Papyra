[package]
name = "papyra-office"
description = "Word and PowerPoint pages for papyra, over WordCraft and DeckCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Both engines are git-pinned: neither is on crates.io, and both are days old and
# moving fast, so a rev is the only way to know what we built against. Bumping one
# is its own commit, re-run against tests/fixtures.rs.
[dependencies]
papyra-core = { workspace = true }
thiserror = { workspace = true }
# The engines' own major, so it unifies with theirs rather than adding a third zip
# (hayro's is 8). Only the content-type sniff uses it.
zip = { version = "3", default-features = false, features = ["deflate"] }
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "00bc6a4b028013b2dfb0e85e8b326aeed3ecff6d" }
deckcraft-fonts = { git = "https://github.com/storytold/deckcraft", rev = "a31b990d32f2c8562f1588562f922960c3fde48b" }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "a31b990d32f2c8562f1588562f922960c3fde48b" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "a31b990d32f2c8562f1588562f922960c3fde48b" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", rev = "a31b990d32f2c8562f1588562f922960c3fde48b" }
