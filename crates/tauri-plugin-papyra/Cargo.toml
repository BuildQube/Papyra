[package]
name = "tauri-plugin-papyra"
description = "papyra's PDF engine inside a Tauri 2 app: native rendering for the viewer's TauriEngine"
version = "0.7.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/BuildQube/papyra"
rust-version = "1.92"
links = "tauri-plugin-papyra"

# Its own workspace, not a member of the root one: compiling Tauri on Linux needs
# webkit2gtk's development headers, which no existing CI job installs, and a root
# member would put that cost on every `cargo clippy --workspace`.
#
# `office` is the git-only office plugin: a member so the two share one lock and one
# build. `cargo package` leaves a nested package out of this crate's tarball.
[workspace]
members = ["office"]

# PDF is always built. Each other format is a feature, so an app compiles only the
# readers it serves; each has a permission set of the same name.
[features]
tables = ["dep:papyra-tables", "dep:serde_json"]
tiff = ["dep:papyra-tiff"]

[dependencies]
papyra-core = { path = "../papyra-core", version = "0.7.1" }
papyra-encode = { path = "../papyra-encode", version = "0.7.1" }
papyra-hayro = { path = "../papyra-hayro", version = "0.7.1" }
papyra-tables = { path = "../papyra-tables", version = "0.7.1", optional = true }
papyra-tiff = { path = "../papyra-tiff", version = "0.7.1", optional = true }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# Already in the tree through tauri; reads `open_workbook`'s options header.
serde_json = { version = "1", optional = true }
tauri = "2"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
glob = "0.3"
serde_json = "1"
tauri = { version = "2", features = ["test"] }
tauri-utils = "2"
toml = "0.8"

# Cargo reads profiles only from the top-level workspace, so this applies to this
# crate's own tests and nothing else. An app needs the same lines in its own
# manifest — see the README.
[profile.dev.package."*"]
opt-level = 2
