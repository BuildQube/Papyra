# Changesets release flow.
#
# On every push to main, `select-mode` decides what this run is for:
#
#   version  — changesets are pending. Open/refresh the "Version Packages" PR.
#   publish  — no changesets pending and something is unreleased. Build every
#              target and publish to npm, then the crates to crates.io.
#   none     — nothing to do.
#
# So the normal cycle is: merge feature PRs (each with a changeset) -> this
# workflow keeps a Version Packages PR up to date -> merging *that* PR leaves no
# changesets behind, which flips the next run into publish mode.
#
# Publishing uses trusted publishing (OIDC) on npm and crates.io alike, so there is
# no NPM_TOKEN and no crates.io token. That means `id-token: write` must stay scoped
# to the two publish jobs, and each registry's trusted-publisher config for every
# package must name THIS file (release.yml).
# See docs/RELEASING.md for the one-time npm setup.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  # Opens (or refreshes) the Version Packages PR. Needs no build: the root
  # `version` script runs `changeset version`, which rewrites package.json versions
  # and CHANGELOG.md files, then gives the crates the same version, lockfiles
  # included. It has to be this script rather than a later step, or the crate bumps
  # would never be in the PR. Its `cargo update -w` runs on the image's rustup,
  # which installs the toolchain rust-toolchain.toml pins.
  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          script: bun run version
          pr-title: "Version Packages"
          commit-message: "chore: version packages"

  # Same matrix as CI's build job. Duplicated rather than shared through
  # `workflow_call` on purpose: npm validates the OIDC claim against the workflow
  # that contains the publish step, and a reusable workflow reports the *caller's*
  # filename, which breaks trusted publishing.
  build:
    name: build ${{ matrix.target }}
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: ubuntu-latest, target: wasm32-wasip1-threads }
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      # The toolchain comes from rust-toolchain.toml; this only guarantees rustup is
      # present. The target has to be added separately — the action does not read
      # that file, so a `targets:` input here would install to whatever `@stable`
      # resolves to today and leave the pinned toolchain without it.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/bindings
        run: bunx napi build --platform --release --target ${{ matrix.target }}
      - name: Build office
        working-directory: packages/office-bindings
        run: bunx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: office-bindings-${{ matrix.target }}
          path: |
            packages/office-bindings/*.node
            packages/office-bindings/*.wasm
            !packages/office-bindings/*.debug.wasm
            packages/office-bindings/index.js
            packages/office-bindings/index.d.ts
            packages/office-bindings/browser.js
            packages/office-bindings/papyra-office.wasi*.*
            packages/office-bindings/wasi-worker*.mjs
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            packages/bindings/*.node
            packages/bindings/*.wasm
            !packages/bindings/*.debug.wasm
            packages/bindings/index.js
            packages/bindings/index.d.ts
            packages/bindings/browser.js
            packages/bindings/papyra.wasi*.*
            packages/bindings/wasi-worker*.mjs
          if-no-files-found: error

  publish:
    needs: [select-mode, build]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      # `contents: write` pushes the release tags and creates the GitHub releases.
      contents: write
      # One of the two jobs in this repo that may mint an OIDC token; `crates` is
      # the other.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }

      # Trusted publishing is npm's, not bun's: `changeset publish` and napi's
      # platform publish both shell out to `npm publish`. Both need npm >= 11.5.1
      # for OIDC, so pin Node and top up npm rather than trusting the image's.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Writes the project .npmrc that points publishes at npmjs.org. Required
          # even tokenless: without it npm does not treat this as a registry it
          # should attempt an OIDC exchange against.
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Under trusted publishing there is no ambient credential to inspect — npm
      # mints one per publish via OIDC — so `npm whoami` proves nothing here. What
      # can be checked before anything touches the registry is that this job was
      # actually granted `id-token: write`: without it the runner never populates
      # ACTIONS_ID_TOKEN_REQUEST_URL, npm has no token to exchange, and the first
      # publish fails as an opaque 404.
      - name: Check OIDC is available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no OIDC token endpoint — this job is missing 'id-token: write'"
            exit 1
          fi
          echo "OIDC token endpoint present; publishing as a trusted publisher"

      - run: bun install --frozen-lockfile

      # Every target's glue lands in packages/bindings so the root package has an
      # index.js/index.d.ts/browser.js to publish...
      - name: Restore generated glue
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: packages/bindings

      # ...and every binary lands in packages/bindings/artifacts, where
      # `napi artifacts` looks for them before sorting them into npm/<platform>/.
      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: packages/bindings/artifacts

      # The same for the office addon. Its glue is also what `/office` in the
      # wrapper typechecks against, so the wrapper's build needs it as well.
      - name: Restore generated office glue
        uses: actions/download-artifact@v8
        with:
          name: office-bindings-wasm32-wasip1-threads
          path: packages/office-bindings
      - name: Download all office bindings
        uses: actions/download-artifact@v8
        with:
          pattern: office-bindings-*
          path: packages/office-bindings/artifacts

      # `script` runs the root `release` script rather than letting the action call
      # `changeset publish` itself, because napi has to lay out and fill
      # packages/bindings/npm/<platform>/ (and office-bindings') and publish those
      # twelve packages first.
      #
      # That step used to be the bindings package's `prepublishOnly` hook, which
      # made failures undiagnosable: `changeset publish` invokes `npm publish
      # --json`, and npm folds a lifecycle script's entire stderr into one
      # "command failed" string. It now runs as its own step in the release
      # script, where a registry rejection prints in full.
      #
      # It must still run before `changeset publish`: `napi prepublish` writes the
      # root package's optionalDependencies, and those have to be in place before
      # the root package is packed.
      #
      # No NODE_AUTH_TOKEN: all seventeen packages exist and are configured as trusted
      # publishers, so both `npm publish` calls authenticate over OIDC. Setting a
      # token here would silently take precedence and OIDC would never be
      # attempted, so the absence of that env block is load-bearing.
      - name: Publish
        id: publish
        uses: changesets/action/publish@v2
        with:
          script: bun run release

  # Installs every registry item from npm's copy of papyra, which is what tells a
  # stale item range from a fresh one: an item calling an API newer than its
  # `@build-qube/papyra@^x` fails to typecheck here. A job of its own, not a step
  # after Publish, so the shadcn CLI and everything it installs never run where an
  # OIDC token can be minted.
  registry:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - run: bun run check:registry --published

  # papyra-core, papyra-encode, papyra-hayro and tauri-plugin-papyra, on the
  # version the root `version` script gave them, which is the npm packages'.
  #
  # After npm rather than beside it, so a failed npm publish releases no crates.
  # macOS because `cargo publish` verifies by compiling, and Tauri on Linux needs
  # webkit2gtk's headers (see the tauri-plugin job in CI.yml).
  #
  # Each crate is skipped when its version is already in the index, so re-running
  # this job after a partial failure finishes the set. `cargo publish` waits for a
  # crate to appear in the index before returning, so the next one, in dependency
  # order, resolves it.
  crates:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      # Exchanges the OIDC token for a crates.io token that lives 30 minutes.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(jq -r .version packages/papyra/package.json)
          for crate in papyra-core papyra-encode papyra-hayro tauri-plugin-papyra; do
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" \
              | grep -q "\"vers\":\"$version\""; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --manifest-path "crates/$crate/Cargo.toml"
          done
