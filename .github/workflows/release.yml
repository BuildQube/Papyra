# Changesets release flow.
#
# On every push to main, `select-mode` decides what this run is for:
#
#   version  — changesets are pending. Open/refresh the "Version Packages" PR.
#   publish  — no changesets pending and something is unreleased. Build every
#              target and publish to npm.
#   none     — nothing to do.
#
# So the normal cycle is: merge feature PRs (each with a changeset) -> this
# workflow keeps a Version Packages PR up to date -> merging *that* PR leaves no
# changesets behind, which flips the next run into publish mode.
#
# Publishing uses npm Trusted Publishing (OIDC), so there is no NPM_TOKEN. That
# means `id-token: write` must stay scoped to the publish job alone, and npm's
# trusted-publisher config for every package must name THIS file (release.yml).
# See docs/RELEASING.md for the one-time npm setup.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  # Opens (or refreshes) the Version Packages PR. Needs no build: `changeset
  # version` only rewrites package.json versions and CHANGELOG.md files.
  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          pr-title: "Version Packages"
          commit-message: "chore: version packages"

  # Same matrix as CI's build job. Duplicated rather than shared through
  # `workflow_call` on purpose: npm validates the OIDC claim against the workflow
  # that contains the publish step, and a reusable workflow reports the *caller's*
  # filename, which breaks trusted publishing.
  build:
    name: build ${{ matrix.target }}
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: ubuntu-latest, target: wasm32-wasip1-threads }
    runs-on: ${{ matrix.host }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/bindings
        run: bunx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            packages/bindings/*.node
            packages/bindings/*.wasm
            !packages/bindings/*.debug.wasm
            packages/bindings/index.js
            packages/bindings/index.d.ts
            packages/bindings/browser.js
            packages/bindings/papyra.wasi*.*
            packages/bindings/wasi-worker*.mjs
          if-no-files-found: error

  publish:
    needs: [select-mode, build]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` pushes the release tags and creates the GitHub releases.
      contents: write
      # The only job in this repo that may mint an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }

      # Trusted publishing is npm's, not bun's: `changeset publish` and napi's
      # platform publish both shell out to `npm publish`. Both need npm >= 11.5.1
      # for OIDC, so pin Node and top up npm rather than trusting the image's.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Writes the project .npmrc that points publishes at npmjs.org. Required
          # even tokenless: without it npm does not treat this as a registry it
          # should attempt an OIDC exchange against.
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Under trusted publishing there is no ambient credential to inspect — npm
      # mints one per publish via OIDC — so `npm whoami` proves nothing here. What
      # can be checked before anything touches the registry is that this job was
      # actually granted `id-token: write`: without it the runner never populates
      # ACTIONS_ID_TOKEN_REQUEST_URL, npm has no token to exchange, and the first
      # publish fails as an opaque 404.
      - name: Check OIDC is available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no OIDC token endpoint — this job is missing 'id-token: write'"
            exit 1
          fi
          echo "OIDC token endpoint present; publishing as a trusted publisher"

      - run: bun install --frozen-lockfile

      # Every target's glue lands in packages/bindings so the root package has an
      # index.js/index.d.ts/browser.js to publish...
      - name: Restore generated glue
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: packages/bindings

      # ...and every binary lands in packages/bindings/artifacts, where
      # `napi artifacts` looks for them before sorting them into npm/<platform>/.
      - name: Download all bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: packages/bindings/artifacts

      # `script` runs the root `release` script rather than letting the action call
      # `changeset publish` itself, because napi has to lay out and fill
      # packages/bindings/npm/<platform>/ and publish those six packages first.
      #
      # That step used to be the bindings package's `prepublishOnly` hook, which
      # made failures undiagnosable: `changeset publish` invokes `npm publish
      # --json`, and npm folds a lifecycle script's entire stderr into one
      # "command failed" string. It now runs as its own step in the release
      # script, where a registry rejection prints in full.
      #
      # It must still run before `changeset publish`: `napi prepublish` writes the
      # root package's optionalDependencies, and those have to be in place before
      # the root package is packed.
      #
      # No NODE_AUTH_TOKEN: all eight packages exist and are configured as trusted
      # publishers, so both `npm publish` calls authenticate over OIDC. Setting a
      # token here would silently take precedence and OIDC would never be
      # attempted, so the absence of that env block is load-bearing.
      - name: Publish
        uses: changesets/action/publish@v2
        with:
          script: bun run release
