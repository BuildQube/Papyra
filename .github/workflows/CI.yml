name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      # turbo's `typecheck` task dependsOn `^build`, and packages/bindings ships no
      # checked-in index.d.ts — napi generates it from the crate — so tsc cannot run
      # until the Rust bindings have been built. Hence the toolchain and the cache.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # `turbo run test` from source: the wrapper's unit tests plus the binding's own
  # tests against a freshly built host addon. The per-target matrix below runs that
  # same binding suite against the release artifacts instead.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run corpus
      - run: bun run test

  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Built natively on an arm64 runner: cross-linking aarch64 from the
          # x64 host picks up the host linker, which rejects AArch64-only flags.
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: ubuntu-latest, target: wasm32-wasip1-threads }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/bindings
        run: bunx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          # Includes the generated JS glue, not just the binary: index.js is the
          # loader, and the WASI build additionally emits papyra.wasi.cjs and the
          # worker entrypoints. All of it is gitignored, so a downstream job that
          # only downloaded *.node/*.wasm would have nothing to require.
          #
          # `napi build` also writes an unstripped *.debug.wasm beside the release
          # wasm, and the generated loader prefers the debug file whenever it is
          # present. Excluding it is what makes test-wasi exercise the wasm we ship.
          #
          # upload-artifact globs via @actions/glob, which has no brace expansion --
          # `*.{node,wasm}` matches nothing. One path per line.
          path: |
            packages/bindings/*.node
            packages/bindings/*.wasm
            !packages/bindings/*.debug.wasm
            packages/bindings/index.js
            packages/bindings/index.d.ts
            packages/bindings/browser.js
            packages/bindings/papyra.wasi*.*
            packages/bindings/wasi-worker*.mjs
          if-no-files-found: error

  # Runs the real addon on the platform it was compiled for. Nothing here rebuilds
  # Rust: each job downloads the artifact its target produced and runs the bindings
  # package's own `test` script against it — the same command the WASI job below
  # runs, and the same one `turbo run test` runs from source.
  test-binding:
    name: test ${{ matrix.target }} - node@${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin }
          # macos-13 is retired; macos-15-intel is the remaining x86_64 macOS
          # runner, supported until Fall 2027.
          - { host: macos-15-intel, target: x86_64-apple-darwin }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
        node: ["22", "24"]
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - name: Download binding
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: packages/bindings
      - run: bun run corpus
      # `--filter` runs the package script directly rather than through turbo,
      # whose `test` task dependsOn `build` and would recompile the Rust we just
      # downloaded. The Rust toolchain is deliberately absent from this job, so a
      # missing artifact fails loudly instead of quietly rebuilding from source.
      - name: Test binding
        run: bun run --filter @build-qube/papyra-native test
        env:
          PAPYRA_EXPECT_RUNTIME: native

  # The WASI build is the easiest one to test by accident: without a hard assertion
  # the loader silently falls back to a native addon and the job goes green having
  # tested nothing. Two belts here — NAPI_RS_FORCE_WASI=error makes the loader refuse
  # to fall back, and PAPYRA_EXPECT_RUNTIME=wasm makes the test assert what loaded.
  #
  # `NAPI_RS_FORCE_WASI=1`/`true` is NOT enough: those only *prefer* WASI and keep a
  # lazy native fallback. Only `error` requires a WASI flavor to load.
  #
  # Identical command to test-binding above; only the environment differs.
  test-wasi:
    name: test wasm32-wasip1-threads - node@${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - name: Download wasm binding
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: packages/bindings
      # Guards the guard: a native addon in this directory would be preferred by the
      # loader, leaving NAPI_RS_FORCE_WASI nothing to catch.
      - name: Assert no native addon present
        run: |
          if ls packages/bindings/*.node >/dev/null 2>&1; then
            echo "::error::a .node addon is present alongside the wasm artifact — the WASI job would not be testing wasm"
            exit 1
          fi
          ls -la packages/bindings
      - run: bun run corpus
      - name: Test binding on WASI
        run: bun run --filter @build-qube/papyra-native test
        env:
          NAPI_RS_FORCE_WASI: error
          PAPYRA_EXPECT_RUNTIME: wasm

  # Exercises the wider surface (streaming, priorities, Blob input) against a real
  # artifact, without the per-target matrix cost.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/bindings
      - run: bun run --filter @build-qube/papyra build
      - run: bun run corpus
      - run: bun run --filter papyra-bench smoke
