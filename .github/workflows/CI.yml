name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the expensive jobs a pull request needs. lint, typecheck and
  # unit-test always run; everything that compiles Rust or runs a compiled addon is
  # gated on its outputs. Pushes to main run everything, unconditionally: main is
  # what coverage baselines and the badges come from, and a filter that turns out
  # to be missing a path should cost one PR a skipped job, not leave main untested.
  #
  # Gating is done per job with `if:` rather than with `on.pull_request.paths`.
  # A workflow that never starts leaves its checks "Expected — waiting" forever, so
  # a required check could never be satisfied; a job skipped by `if:` reports as
  # skipped, which GitHub counts as passing. `ci-ok` at the bottom is the single
  # check branch protection should require.
  #
  # When in doubt a path belongs under `full`: a needless full run costs minutes, a
  # missing path ships an untested addon.
  changes:
    runs-on: ubuntu-latest
    permissions:
      # paths-filter lists a PR's files through the API, so no checkout is needed.
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      coverage: ${{ steps.plan.outputs.coverage }}
      registry: ${{ steps.plan.outputs.registry }}
      smoke: ${{ steps.plan.outputs.smoke }}
      demo: ${{ steps.plan.outputs.demo }}
      build: ${{ steps.plan.outputs.build }}
      build-exclude: ${{ steps.plan.outputs.build-exclude }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # Everything the Rust jobs consume. The root manifest and lockfile are
            # here because they pin @napi-rs/cli, emnapi and @napi-rs/wasm-runtime,
            # which generate the loader and wasm glue every binding test runs; the
            # corpus script because every addon-backed job reads its output.
            full:
              - 'crates/**'
              - 'packages/bindings/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/CI.yml'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'scripts/fetch-corpus.ts'
            # The coverage job's TypeScript half runs the wrapper's own suites, so
            # a wrapper change moves its numbers without touching any Rust.
            coverage:
              - 'packages/papyra/**'
              - 'scripts/coverage.ts'
              - 'scripts/coverage-report.ts'
            registry:
              - 'packages/papyra/**'
              - 'packages/pdf-viewer/**'
              - 'packages/ui/**'
            smoke:
              - 'packages/papyra/**'
              - 'apps/bench/**'
            demo:
              - 'packages/papyra/**'
              - 'packages/pdf-viewer/**'
              - 'packages/ui/**'
              - 'packages/docs-gen/**'
              - 'apps/demo/**'
      # smoke needs the linux-x64 addon and demo the wasm one, so a TypeScript-only
      # PR still builds those two targets — and only those. The four others exist
      # for test-binding, which only a Rust change runs.
      - id: plan
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
          FULL: ${{ steps.filter.outputs.full }}
          COVERAGE: ${{ steps.filter.outputs.coverage }}
          REGISTRY: ${{ steps.filter.outputs.registry }}
          SMOKE: ${{ steps.filter.outputs.smoke }}
          DEMO: ${{ steps.filter.outputs.demo }}
        run: |
          full=false
          if [ "$PUSH" = true ] || [ "$FULL" = true ]; then full=true; fi
          either() { if [ "$full" = true ] || [ "$1" = true ]; then echo true; else echo false; fi; }
          smoke=$(either "$SMOKE")
          demo=$(either "$DEMO")

          exclude='[]'
          if [ "$full" != true ]; then
            exclude=$(jq -nc --argjson smoke "$smoke" --argjson demo "$demo" '
              ["aarch64-apple-darwin", "x86_64-apple-darwin",
               "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
              + (if $smoke then [] else ["x86_64-unknown-linux-gnu"] end)
              + (if $demo then [] else ["wasm32-wasip1-threads"] end)
              | map({target: .})')
          fi

          build=false
          if [ "$full" = true ] || [ "$smoke" = true ] || [ "$demo" = true ]; then build=true; fi

          {
            echo "full=$full"
            echo "coverage=$(either "$COVERAGE")"
            echo "registry=$(either "$REGISTRY")"
            echo "smoke=$smoke"
            echo "demo=$demo"
            echo "build=$build"
            echo "build-exclude=$exclude"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      # Version and components both come from rust-toolchain.toml; this step only
      # guarantees rustup is present to honour it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Catches a `workspace:` range in a publishable manifest before it can reach
      # the registry, where it makes the package uninstallable under npm.
      - run: bun run check:publishable
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      # turbo's `typecheck` task dependsOn `^build`, and packages/bindings ships no
      # checked-in index.d.ts — napi generates it from the crate — so tsc cannot run
      # until the Rust bindings have been built. Hence the toolchain and the cache.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Installs every registry item into a fresh Base UI and a fresh Radix shadcn
  # project and typechecks both. Nothing else compiles the Radix flavour — it is a
  # build output — so without this it drifts the first time an item uses a Base UI
  # API radix.ts has no rule for. The fixtures link the workspace's papyra, which is
  # why the bindings (and so the toolchain) have to be built first.
  registry:
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@build-qube/papyra
      - run: bun run check:registry

  rust-test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The wrapper's pure-TypeScript units. cache.ts and scheduler.ts have no imports
  # at all, so this needs no addon, no Rust and no build — run it directly rather
  # than through `turbo run test`, whose `test` task dependsOn `build`.
  # The compiled binding is covered per-target by test-binding / test-wasi below.
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - run: bun run --filter @build-qube/papyra test

  # One job for both languages, because the Rust half depends on the TypeScript half:
  # `packages/bindings` has no `#[test]` in it and the render path is only reachable
  # across the napi boundary, so the addon is built with LLVM instrumentation and the
  # JS suites are what exercise it. `cargo test` alone reports the bindings crate at
  # 0%. scripts/coverage.ts has the full explanation and refuses to emit a report if
  # that 0% ever comes back — the failure modes here all produce a plausible number
  # rather than an error.
  #
  # Deliberately not wired into `needs: build`: that matrix builds `--release` and
  # uninstrumented, so this job has to compile its own addon regardless.
  #
  # There is no coverage service behind this. scripts/coverage-report.ts writes the
  # badge SVGs and the PR comment itself, so the whole thing runs on GITHUB_TOKEN
  # with no account, no repo activation and no secret to configure. What that gives
  # up is trend history and line-level annotations in the Files-changed view.
  #
  # Skipped on a PR that touches neither Rust nor the wrapper, which then gets no
  # coverage comment. The baseline is unaffected: it comes from main, where this
  # always runs.
  coverage:
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Force-pushing the badge branch, and posting the PR comment. Both are scoped
      # to this job; the workflow default stays read-only.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        # Patch coverage diffs against the PR's merge base, which a shallow clone
        # does not contain.
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
      # llvm-profdata and llvm-cov ship in this component, and it is deliberately
      # absent from rust-toolchain.toml: listing it there would make every clone
      # download it for a tool only this job runs.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with: { key: "coverage" }
      - run: bun install --frozen-lockfile
      # The wrapper's integration tests open real PDFs, and they are most of what
      # drives the Rust render path.
      - run: bun run corpus
      - run: bun run coverage
      # The delta column compares against the last green run on main. Advisory: the
      # first ever run has nothing to compare to, and a main run can be missing
      # because it was cancelled, so a failure here must not fail the job.
      - name: Fetch the main baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --workflow CI.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -n coverage-summary -D baseline
          else
            echo "no successful main run yet — the delta column will be empty"
          fi
      - name: Build the report
        run: |
          args=()
          if [ -f baseline/summary.json ]; then
            args+=(--base baseline/summary.json)
          fi
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            args+=(--diff-base "${{ github.event.pull_request.base.sha }}")
          fi
          bun run scripts/coverage-report.ts "${args[@]}"
      # Always available, including on a fork PR where the token cannot comment.
      - name: Add to the job summary
        run: cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      # `--edit-last` keeps one comment per PR rather than a new one per push.
      # A fork PR gets a read-only token and cannot post at all, hence the tolerance;
      # the job summary above still carries the numbers.
      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file coverage/report.md --edit-last --create-if-none
      # Becomes the next run's baseline.
      - name: Upload the summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/summary.json
          if-no-files-found: error
      # Badges live on an orphan `badges` branch, force-pushed from a scratch repo so
      # nothing lands in main's history and the branch never accumulates one commit
      # per run. README points at raw.githubusercontent.com.
      - name: Publish the badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp=$(mktemp -d)
          cp coverage/coverage.svg coverage/coverage-rust.svg coverage/coverage-ts.svg "$tmp/"
          cd "$tmp"
          git init -q -b badges
          git add .
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Coverage badges for ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  build:
    name: build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      # `target` is a real matrix key, with `host` attached by `include`, because
      # `exclude` only removes base combinations — it cannot touch entries that a
      # pure-`include` matrix adds afterwards. `changes` excludes every target the
      # run has no job for; an empty list builds all six.
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - wasm32-wasip1-threads
        include:
          - { target: aarch64-apple-darwin, host: macos-latest }
          - { target: x86_64-apple-darwin, host: macos-latest }
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-latest }
          # Built natively on an arm64 runner: cross-linking aarch64 from the
          # x64 host picks up the host linker, which rejects AArch64-only flags.
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, host: windows-latest }
          - { target: wasm32-wasip1-threads, host: ubuntu-latest }
        exclude: ${{ fromJSON(needs.changes.outputs.build-exclude) }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      # The toolchain comes from rust-toolchain.toml; this only guarantees rustup is
      # present. The target has to be added separately — the action does not read
      # that file, so a `targets:` input here would install to whatever `@stable`
      # resolves to today and leave the pinned toolchain without it.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/bindings
        run: bunx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          # Includes the generated JS glue, not just the binary: index.js is the
          # loader, and the WASI build additionally emits papyra.wasi.cjs and the
          # worker entrypoints. All of it is gitignored, so a downstream job that
          # only downloaded *.node/*.wasm would have nothing to require.
          #
          # `napi build` also writes an unstripped *.debug.wasm beside the release
          # wasm, and the generated loader prefers the debug file whenever it is
          # present. Excluding it is what makes test-wasi exercise the wasm we ship.
          #
          # upload-artifact globs via @actions/glob, which has no brace expansion --
          # `*.{node,wasm}` matches nothing. One path per line.
          path: |
            packages/bindings/*.node
            packages/bindings/*.wasm
            !packages/bindings/*.debug.wasm
            packages/bindings/index.js
            packages/bindings/index.d.ts
            packages/bindings/browser.js
            packages/bindings/papyra.wasi*.*
            packages/bindings/wasi-worker*.mjs
          if-no-files-found: error

  # Runs the real addon on the platform it was compiled for. Nothing here rebuilds
  # Rust: each job downloads the artifact its target produced and runs the bindings
  # package's own `test` script against it — the same command the WASI job below
  # runs, with the environment as the only difference.
  test-binding:
    name: test ${{ matrix.target }} - node@${{ matrix.node }}
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      # `target` and `node` must both be real matrix keys so the product expands to
      # ten jobs. `include` entries whose keys are all absent from the base matrix
      # get merged into *every* combination, each overwriting the last — a matrix of
      # pure `include` plus a bare `node` list silently collapses to the final entry.
      # Keying the includes on `target` makes each one apply to its own combinations.
      matrix:
        node: ["22", "24"]
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - { target: aarch64-apple-darwin, host: macos-latest }
          # macos-13 is retired; macos-15-intel is the remaining x86_64 macOS
          # runner, supported until Fall 2027.
          - { target: x86_64-apple-darwin, host: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, host: windows-latest }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - name: Download binding
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: packages/bindings
      - run: bun run corpus
      # `--filter` runs the package script directly rather than through turbo,
      # whose `test` task dependsOn `build` and would recompile the Rust we just
      # downloaded. The Rust toolchain is deliberately absent from this job, so a
      # missing artifact fails loudly instead of quietly rebuilding from source.
      - name: Test binding
        run: bun run --filter @build-qube/papyra-native test
        env:
          PAPYRA_EXPECT_RUNTIME: native

  # The WASI build is the easiest one to test by accident: without a hard assertion
  # the loader silently falls back to a native addon and the job goes green having
  # tested nothing. Two belts here — NAPI_RS_FORCE_WASI=error makes the loader refuse
  # to fall back, and PAPYRA_EXPECT_RUNTIME=wasm makes the test assert what loaded.
  #
  # `NAPI_RS_FORCE_WASI=1`/`true` is NOT enough: those only *prefer* WASI and keep a
  # lazy native fallback. Only `error` requires a WASI flavor to load.
  #
  # Identical command to test-binding above; only the environment differs.
  test-wasi:
    name: test wasm32-wasip1-threads - node@${{ matrix.node }}
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - name: Download wasm binding
        uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: packages/bindings
      # Guards the guard: a native addon in this directory would be preferred by the
      # loader, leaving NAPI_RS_FORCE_WASI nothing to catch.
      - name: Assert no native addon present
        run: |
          if ls packages/bindings/*.node >/dev/null 2>&1; then
            echo "::error::a .node addon is present alongside the wasm artifact — the WASI job would not be testing wasm"
            exit 1
          fi
          ls -la packages/bindings
      - run: bun run corpus
      - name: Test binding on WASI
        run: bun run --filter @build-qube/papyra-native test
        env:
          NAPI_RS_FORCE_WASI: error
          PAPYRA_EXPECT_RUNTIME: wasm

  # Exercises the wider surface (streaming, priorities, Blob input) against a real
  # artifact, without the per-target matrix cost.
  smoke:
    needs: [changes, build]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/bindings
      - run: bun run --filter @build-qube/papyra build
      - run: bun run corpus
      # The wrapper's tests that need a real addon and real PDFs: outline walking,
      # text extraction and search against the pdf.js corpus. `unit-test` above runs
      # with no artifact, so these cannot live alongside the pure units.
      - run: bun run --filter @build-qube/papyra test:integration
      - run: bun run --filter papyra-bench smoke

  # deploy-demo.yml only runs on main, so without this a demo that no longer builds
  # would not surface until after merge, as a failed deploy. Builds against the wasm
  # artifact — the demo runs papyra's wasm flavour and never loads a native addon —
  # so no Rust toolchain is needed here.
  demo:
    needs: [changes, build]
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: bindings-wasm32-wasip1-threads
          path: packages/bindings
      - run: bun run --filter @build-qube/papyra build
      - name: Build demo
        run: bun run --filter papyra-demo build
        env:
          # Same prefix the Pages deploy uses, so a base-path regression fails here.
          PAPYRA_BASE: /${{ github.event.repository.name }}/

  # The one check branch protection should require. Matrix jobs that `if:` skips
  # report under their unexpanded names ("build ${{ matrix.target }}"), and jobs that
  # never ran on a PR cannot be required at all, so requiring the jobs themselves
  # would block merges whenever the filter did its job. This passes when everything
  # it depends on succeeded or was skipped, and fails on any failure or
  # cancellation — including `changes` itself failing, which skips everything else.
  ci-ok:
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - registry
      - rust-test
      - unit-test
      - coverage
      - build
      - test-binding
      - test-wasi
      - smoke
      - demo
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "::error::a required job failed or was cancelled: $RESULTS"
          exit 1
      - run: echo "all jobs passed or were skipped by the path filter"
