name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: cargo test --workspace
      - run: bun run corpus
      - run: bun run build
      - run: bun run --filter papyra-bench smoke
      - run: bun run typecheck

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest,   target: aarch64-apple-darwin }
          - { host: macos-latest,   target: x86_64-apple-darwin }
          - { host: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: ubuntu-latest,  target: wasm32-wasip1-threads }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/bindings
        run: bunx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/bindings/*.{node,wasm}
          if-no-files-found: error
