# Builds apps/demo and publishes it to GitHub Pages.
#
# Currently fires on every push to main. Once releases are flowing, the intended
# trigger is a completed changesets release — swap the `push` trigger for:
#
#   workflow_run:
#     workflows: [Release]
#     types: [completed]
#
# ...and gate the job on `github.event.workflow_run.conclusion == 'success'`.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy midway; queue behind the running one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      # The demo runs papyra's wasm build, so this job compiles
      # wasm32-wasip1-threads as well as the host target that the TypeScript
      # wrapper's `tsc` step needs typings from.
      #
      # The toolchain comes from rust-toolchain.toml; this only guarantees rustup is
      # present. The target has to be added separately — the action does not read
      # that file, so a `targets:` input here would install to whatever `@stable`
      # resolves to today and leave the pinned toolchain without it, which is exactly
      # how this job broke when the pin landed.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2
      - uses: actions/configure-pages@v6
      - run: bun install --frozen-lockfile
      - name: Build
        # Project sites are served from https://<owner>.github.io/<repo>/, so the
        # bundle has to be built for that prefix rather than the root.
        run: bun run build
        env:
          PAPYRA_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
